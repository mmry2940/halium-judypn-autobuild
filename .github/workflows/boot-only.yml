name: Build Boot Image Only (Fast Cloud Build)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch to build'
        required: true
        default: 'lineage-21'
      selinux_mode:
        description: 'SELinux mode (permissive or enforcing)'
        required: true
        default: 'permissive'
      enable_telnet:
        description: 'Enable USB Telnet debug daemon'
        required: true
        type: boolean
        default: true

jobs:
  build-boot:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Autobuild Repo
        uses: actions/checkout@v4

      - name: Setup Build Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential bc bison flex libssl-dev libelf-dev libncurses5-dev \
            git curl cpio gzip python3
          
          # Download mkbootimg script since it's not a standard package in 22.04
          sudo curl -sSL https://raw.githubusercontent.com/LineageOS/android_system_core/lineage-21.0/mkbootimg/mkbootimg.py -o /usr/local/bin/mkbootimg
          sudo chmod +x /usr/local/bin/mkbootimg

      - name: Clone SDM845 Kernel Source (Lineage-21)
        run: |
          echo "Cloning kernel from LineageOS/android_kernel_lge_sdm845..."
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch || 'lineage-21' }} \
            https://github.com/LineageOS/android_kernel_lge_sdm845.git kernel
          cd kernel

      - name: Compile SDM845 Kernel Image.gz-dtb
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Configure SDM845 defconfig
          make judypn_defconfig || make sdm845_defconfig || make lineageos_judypn_defconfig
          
          # Compile kernel and concatenated DTB
          make -j$(nproc) Image.gz-dtb

      - name: Assemble Hybris Ramdisk
        run: |
          mkdir -p ramdisk/sbin ramdisk/bin ramdisk/etc ramdisk/dev ramdisk/proc ramdisk/sys
          cat << 'EOF' > ramdisk/init
          #!/bin/sh
          echo "=== Halium Early Boot ==="
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev
          
          # USB Networking for debug
          ifconfig usb0 192.168.2.15 up 2>/dev/null || true
          
          if [ "${{ github.event.inputs.enable_telnet }}" = "true" ]; then
            busybox telnetd -l /bin/sh -p 23 2>/dev/null || true
          fi
          
          exec /bin/sh
          EOF
          chmod +x ramdisk/init
          
          # Create CPIO ramdisk
          cd ramdisk
          find . | cpio -o -H newc | gzip -9 > ../ramdisk.cpio.gz
          cd ..

      - name: Pack Real hybris-boot.img
        run: |
          CMDLINE="console=ttyMSM0,115200,n8 androidboot.console=ttyMSM0 androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x237 ehci-hcd.park=3 lpm_levels.sleep_disabled=1 service_locator.enable=1 androidboot.bootdevice=1d84000.ufshc androidboot.selinux=${{ github.event.inputs.selinux_mode || 'permissive' }} telnet_debug=1 usb_net=192.168.2.15"
          
          KERNEL_BIN=$(find kernel/arch/arm64/boot/ -name "Image.gz-dtb" -o -name "Image.gz" | head -n 1)
          
          python3 /usr/local/bin/mkbootimg \
            --kernel "$KERNEL_BIN" \
            --ramdisk ramdisk.cpio.gz \
            --cmdline "$CMDLINE" \
            --base 0x00000000 \
            --pagesize 4096 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --output hybris-boot.img
          
          md5sum hybris-boot.img > hybris-boot.img.md5

      - name: Upload hybris-boot.img
        uses: actions/upload-artifact@v4
        with:
          name: hybris-boot-judypn
          path: |
            hybris-boot.img
            hybris-boot.img.md5
