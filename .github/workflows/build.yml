name: Halium Image

on: 
  workflow_dispatch:
  push:
    branches:
      - hybris
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions: 
      contents: read

    env:
      DEVICE: judypn
      ANDROID_ROOT: /home/runner/work/halium/

    steps:
    - name: Checkout into Directory
      uses: actions/checkout@master
    
    - name: Initialization environment
      run: |
        # Fix potential DNS/Mirror issues by forcing main Ubuntu archives and adding retries
        sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list || true
        sudo sed -i 's|http://security.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list || true
        
        # Retry apt-get update
        for i in {1..3}; do
          sudo apt-get update && break || (echo "Apt update failed, retrying in 10s..." && sleep 10)
        done
        
        sudo apt-get install -y \
        openjdk-8-jdk android-tools-adb bc \
        bison build-essential curl flex g++-multilib \
        gcc-multilib gnupg gperf imagemagick lib32ncurses-dev \
        lib32readline-dev lib32z1-dev libsdl2-dev libpulse-dev liblz4-tool \
        libncurses-dev libsdl1.2-dev libssl-dev libwxgtk3.0-gtk3-dev \
        libxml2 libxml2-utils lzop pngcrush rsync schedtool \
        squashfs-tools xsltproc yasm zip zlib1g-dev git repo \
        crossbuild-essential-armel
        ##sudo docker rmi "docker images -q"
        sudo rm -rf \
          /usr/share/dotnet \
          /etc/mysql \
          /etc/php
        mkdir -p ~/bin
        wget 'https://storage.googleapis.com/git-repo-downloads/repo' -P ~/bin
        chmod +x ~/bin/repo
        sudo cp ~/bin/repo /usr/bin/repo
        git config --global user.name "mmry2940"
        git config --global user.email "mmry2940@gmail.com"
    - name: Downloading source code
      run: |
        source halium.env
        mkdir -p $ANDROID_ROOT
        cd $ANDROID_ROOT
        repo init -u https://github.com/Halium/android -b halium-14.0 --depth=1 --git-lfs
        repo sync -c -j12 --fail-fast
    - name: Copy Device Manifest
      run: |
         cp lge_judypn.xml $ANDROID_ROOT/halium/devices/manifests/lge_judypn.xml
    
    - name: Clone device spec source
      run: |
         cd $ANDROID_ROOT
         sudo ./halium/devices/setup judypn
    - name: Build HAL
      run: |
        cd $ANDROID_ROOT
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        source $ANDROID_ROOT/build/envsetup.sh
        breakfast judypn
        mka mkbootimg
        mka halium-boot
        mka systemimage
      shell: bash

    - name : Upload mkbootimg
      uses: actions/upload-artifact@master
      with:
        name: hybris-boot image
        path: /home/runner/work/halium/out/target/product/judypn/boot.img


    - name : Upload boot image
      uses: actions/upload-artifact@master
      with:
        name: hybris-boot image
        path: /home/runner/work/halium/out/target/product/judypn/hybris-boot.img

    - name : Upload system image
      uses: actions/upload-artifact@master
      with:
        name: System image
        path: /home/runner/work/halium/out/target/product/judypn/system.img
